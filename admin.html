        .btn-outline { background: #fff; color: var(--accent); border: 1px solid var(--border); }

        .btn-danger { background: #fff; color: #c44; border: 1px solid #ecc; }

        .btn-sm { padding: 4px 10px; font-size: 11px; }
        .photo-card { transition: all 0.15s; cursor: grab; }
        .photo-card:active { cursor: grabbing; }
        .photo-card.dragging { opacity: 0.4; }
        .photo-card.drag-over { border-color: var(--accent); background: #fafaf8; }
        .photo-thumb { width: 140px; height: 100px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
        .status-dot.saved { background: #4a4; }
        .status-dot.unsaved { background: #ea4; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        iframe.preview-frame { width: 100%; height: 100%; border: none; border-radius: 8px; }

    <div id="loginGate" style="position:fixed;inset:0;z-index:99999;background:#2c2a27;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;">
        <div style="text-align:center;">
            <div style="color:#fff;font-size:48px;font-weight:300;letter-spacing:0.1em;margin-bottom:8px;">zᶻ</div>
            <div style="color:rgba(255,255,255,0.4);font-size:12px;letter-spacing:0.3em;text-transform:uppercase;">Admin Console</div>
        </div>
        <input id="loginPwd" type="password" placeholder="输入密码"
               style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:10px 20px;border-radius:4px;width:240px;text-align:center;font-size:14px;letter-spacing:0.2em;outline:none;"

                onmouseover="this.style.background='rgba(255,255,255,0.2)';this.style.color='#fff'"
                onmouseout="this.style.background='rgba(255,255,255,0.12)';this.style.color='rgba(255,255,255,0.7)'">进入后台</button>
        <div id="loginError" style="color:#e07060;font-size:11px;display:none;">密码错误</div>
    </div>
    <script>
    async function checkPwd() {
        const pw = document.getElementById('loginPwd').value;
        const encoder = new TextEncoder();
        const data = encoder.encode(pw + 'roy_zhao_salt_2026');
        const hash = await crypto.subtle.digest('SHA-256', data);
        const inputHash = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
        const storedHash = 'cd87789d49b1782efac3c8cc0d828145371588d8ca196cff4cfcaa6a72d571ef';
        if (inputHash === storedHash) {
            document.getElementById('loginGate').style.display = 'none';
            sessionStorage.setItem('admin_authed', '1');
        } else {
            document.getElementById('loginError').style.display = 'block';
            document.getElementById('loginPwd').value = '';
            document.getElementById('loginPwd').focus();
        }
    }
    if (sessionStorage.getItem('admin_authed') === '1') {
        document.getElementById('loginGate').style.display = 'none';
    }
    </script>

// ========== INIT ==========
function loadData() {
    const saved = localStorage.getItem('roy_zhao_admin_data');
    if (saved) {
        try {
            const data = JSON.parse(saved);
            photos = data.photos || DEFAULTS.photos;
            destinations = data.destinations || DEFAULTS.destinations;
            heroData = data.hero || DEFAULTS.hero;
            aboutData = data.about || DEFAULTS.about;
            gbData = data.guestbook || DEFAULTS.guestbook;
        } catch(e) { loadDefaults(); }
    } else {
        loadDefaults();
    }
    fillForms();
    renderGalleryEditor();
    renderDestinationsEditor();
}

function loadDefaults() {
    photos = JSON.parse(JSON.stringify(DEFAULTS.photos));
    destinations = JSON.parse(JSON.stringify(DEFAULTS.destinations));
    heroData = JSON.parse(JSON.stringify(DEFAULTS.hero));
    aboutData = JSON.parse(JSON.stringify(DEFAULTS.about));
    gbData = JSON.parse(JSON.stringify(DEFAULTS.guestbook));
}

function switchTab(name) {

             draggable="true"

             ondragend="dragEnd(event)">

            <div class="relative flex-shrink-0">
                <img src="${p.src}" alt="" class="photo-thumb bg-gray-100"
                     onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22100%22><rect fill=%22%23ddd%22 width=%22140%22 height=%22100%22/><text x=%2270%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2211%22>No Image</text></svg>'">

            </div>
            <!-- Fields -->
            <div class="flex-1 grid grid-cols-2 md:grid-cols-4 gap-2 min-w-0">
                ${field('标题', 'title', i, p.title, 6)}
                ${field('地点', 'location', i, p.location, 4)}
                ${field('相机', 'camera', i, p.camera, 4)}
                ${field('底片', 'film', i, p.film, 4)}
                ${field('光圈', 'aperture', i, p.aperture, 3)}
                ${field('快门', 'shutter', i, p.shutter, 3)}
                ${field('焦距', 'focal', i, p.focal, 3)}
                ${field('路径', 'src', i, p.src, 3)}
                <div class="col-span-2 md:col-span-4">
                    <label class="label-sm">描述</label>
                    <input class="input-field" value="${escapeHtml(p.desc||'')}" onchange="updatePhoto(${i},'desc',this.value)">
                </div>
            </div>
            <!-- Actions -->
            <div class="flex flex-col gap-1 flex-shrink-0 opacity-60 group-hover:opacity-100 transition-opacity">
                <button onclick="duplicatePhoto(${i})" class="p-1.5 text-xs text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded" title="复制"><i class="fa-solid fa-copy"></i></button>
                <button onclick="movePhoto(${i},-1)" class="p-1.5 text-xs text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded ${i===0?'opacity-20':''}" title="上移" ${i===0?'disabled':''}><i class="fa-solid fa-chevron-up"></i></button>
                <button onclick="movePhoto(${i},1)" class="p-1.5 text-xs text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded ${i===photos.length-1?'opacity-20':''}" title="下移" ${i===photos.length-1?'disabled':''}><i class="fa-solid fa-chevron-down"></i></button>
                <button onclick="deletePhoto(${i})" class="p-1.5 text-xs text-red-400 hover:text-red-600 hover:bg-red-50 rounded mt-2" title="删除"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>
    `).join('');
}

function field(label, key, index, value, cols) {
    return `<div><label class="label-sm">${label}</label><input class="input-field" value="${escapeHtml(value||'')}" onchange="updatePhoto(${index},'${key}',this.value)"></div>`;
}

function escapeHtml(str) { return (str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function updatePhoto(index, field, value) {
    photos[index][field] = value;
    scheduleSave();
}

function movePhoto(index, direction) {
    const newIdx = index + direction;
    if (newIdx < 0 || newIdx >= photos.length) return;
    [photos[index], photos[newIdx]] = [photos[newIdx], photos[index]];
    photos.forEach((p, i) => p.id = i + 1);
    renderGalleryEditor();
    scheduleSave();
}

function deletePhoto(index) {
    if (!confirm(`删除照片 #${index+1}「${photos[index].title}」？`)) return;
    photos.splice(index, 1);
    photos.forEach((p, i) => p.id = i + 1);
    renderGalleryEditor();
    scheduleSave();
    showToast('照片已删除');
}

function duplicatePhoto(index) {
    const orig = photos[index];
    const copy = JSON.parse(JSON.stringify(orig));
    copy.id = Math.max(0, ...photos.map(p => p.id)) + 1;
    copy.title = (copy.title || '') + ' (副本)';
    photos.splice(index + 1, 0, copy);
    photos.forEach((p, i) => p.id = i + 1);
    renderGalleryEditor();
    scheduleSave();
    showToast('照片已复制');
}

function addPhoto() {
    photos.push({
        id: Math.max(0, ...photos.map(p => p.id)) + 1,
        title:'新照片', category:'landscape', src:'images/', film:'Digital',
        camera:'Nikon Z7Ⅱ', aperture:'f/5.6', shutter:'1/125s', focal:'24-200mm', location:'', desc:''
    });
    renderGalleryEditor();
    scheduleSave();
    const last = document.getElementById('galleryEditor').lastElementChild;
    if (last) { last.scrollIntoView({ behavior:'smooth' }); last.classList.add('ring-2', 'ring-blue-300'); setTimeout(() => last.classList.remove('ring-2','ring-blue-300'), 2000); }
}

function batchEdit() {
    const field = prompt('批量设置哪个字段？\n(title / camera / film / location / aperture / shutter / focal)', 'camera');
    if (!field) return;
    const value = prompt(`将所有照片的 "${field}" 设置为：`, '');
    if (value === null) return;
    photos.forEach(p => { p[field] = value; });
    renderGalleryEditor();
    scheduleSave();
    showToast(`已批量更新 ${field}`);
}

// ========== DRAG AND DROP ==========
let dragIndex = null;

function dragStart(e, index) {
    dragIndex = index;
    e.target.closest('.photo-card').classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', index);
}

function dragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const card = e.target.closest('.photo-card');
    if (card) card.classList.add('drag-over');
}

function dragLeave(e) {
    const card = e.target.closest('.photo-card');
    if (card) card.classList.remove('drag-over');
}

function drop(e, targetIndex) {
    e.preventDefault();
    document.querySelectorAll('.photo-card').forEach(c => c.classList.remove('drag-over','dragging'));
    if (dragIndex === null || dragIndex === targetIndex) return;
    const [moved] = photos.splice(dragIndex, 1);
    photos.splice(targetIndex, 0, moved);
    photos.forEach((p, i) => p.id = i + 1);
    dragIndex = null;
    renderGalleryEditor();
    scheduleSave();
    showToast('排序已更新');
}

function dragEnd(e) {
    document.querySelectorAll('.photo-card').forEach(c => c.classList.remove('drag-over','dragging'));
    dragIndex = null;
}

            portraitLabel: document.getElementById('about-portrait-label')?.value || '',
            douyin: document.getElementById('about-douyin')?.value || '',
            xhs: document.getElementById('about-xhs')?.value || '',
            weibo: document.getElementById('about-weibo')?.value || ''
        },
        guestbook: {
            tagZh: document.getElementById('gb-tag-zh')?.value || '',
            tagEn: document.getElementById('gb-tag-en')?.value || '',
            headingZh: document.getElementById('gb-heading-zh')?.value || '',
            headingEn: document.getElementById('gb-heading-en')?.value || ''
        },
        photos: photos,
        destinations: destinations
    };
}

function scheduleSave() {
    document.getElementById('saveLabel').textContent = '未保存';
    document.querySelector('#saveIndicator .status-dot').classList.remove('saved');
    document.querySelector('#saveIndicator .status-dot').classList.add('unsaved');
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
        const data = collectData();
        localStorage.setItem('roy_zhao_admin_data', JSON.stringify(data));
        document.getElementById('saveLabel').textContent = '已保存';
        document.querySelector('#saveIndicator .status-dot').classList.add('saved');
        document.querySelector('#saveIndicator .status-dot').classList.remove('unsaved');
    }, 800);
}

function exportJSON() {
    const data = collectData();
    localStorage.setItem('roy_zhao_admin_data', JSON.stringify(data));
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'portfolio-data-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('JSON 已下载 ✅');
    document.getElementById('saveLabel').textContent = '已保存';
    document.querySelector('#saveIndicator .status-dot').classList.add('saved');
}

function resetAll() {
    if (!confirm('确定要重置所有数据为默认值吗？此操作不可撤销。')) return;
    localStorage.removeItem('roy_zhao_admin_data');
    loadDefaults();
    fillForms();
    renderGalleryEditor();
    renderDestinationsEditor();
    showToast('已重置为默认值');
}

function importFromPage() {
    const raw = localStorage.getItem('roy_zhao_admin_data');
    if (!raw) { showToast('没有可导入的数据'); return; }
    if (!confirm('从上次保存的数据恢复？')) return;
    try {
        const data = JSON.parse(raw);
        photos = data.photos || DEFAULTS.photos;
        destinations = data.destinations || DEFAULTS.destinations;
        heroData = data.hero || DEFAULTS.hero;
        aboutData = data.about || DEFAULTS.about;
        gbData = data.guestbook || DEFAULTS.guestbook;
        fillForms();
        renderGalleryEditor();
        renderDestinationsEditor();
        showToast('数据已导入 ✅');
    } catch(e) { showToast('导入失败'); }
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toastText').textContent = msg;
    toast.classList.remove('translate-y-20','opacity-0');
    toast.classList.add('translate-y-0','opacity-100');
    setTimeout(() => {
        toast.classList.add('translate-y-20','opacity-0');
        toast.classList.remove('translate-y-0','opacity-100');
    }, 2200);
}

// ========== EVENT LISTENERS ==========
document.addEventListener('DOMContentLoaded', () => {
    loadData();
    // Live preview binding
    ['hero-tag-zh','hero-heading-zh','hero-quote-zh'].forEach(id => {
        document.getElementById(id)?.addEventListener('input', updateHeroPreview);
    });
    ['about-intro-zh','about-equip','about-film','about-location'].forEach(id => {
        document.getElementById(id)?.addEventListener('input', updateAboutPreview);
    });
    ['gb-tag-zh','gb-heading-zh'].forEach(id => {
        document.getElementById(id)?.addEventListener('input', updateGbPreview);
    });
    // Auto-save on any input
    document.addEventListener('input', (e) => {
        if (e.target.closest('.input-field') || e.target.tagName === 'TEXTAREA') {
            scheduleSave();
        }
    });
});

// ========== KEYBOARD SHORTCUTS ==========
document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey) {
        switch(e.key) {
            case 's': e.preventDefault(); const d=collectData(); localStorage.setItem('roy_zhao_admin_data',JSON.stringify(d)); showToast('已保存 💾'); document.getElementById('saveLabel').textContent='已保存'; break;
            case 'e': e.preventDefault(); exportJSON(); break;
            case '1': e.preventDefault(); switchTab('hero'); break;
            case '2': e.preventDefault(); switchTab('gallery'); break;
            case '3': e.preventDefault(); switchTab('about'); break;
            case '4': e.preventDefault(); switchTab('guestbook'); break;
            case '5': e.preventDefault(); switchTab('messages'); loadMessages(); break;
        }
    }
});

// ========== MESSAGE MANAGEMENT ==========
function loadMessages() {
    const container = document.getElementById('messagesList');
    container.innerHTML = '<div class="text-center text-gray-400 py-4"><i class="fa-solid fa-spinner animate-spin"></i> 加载中...</div>';

    db.collection('guestbook').orderBy('createdAt', 'desc').limit(100).get().then(snapshot => {
        document.getElementById('msgCount').textContent = snapshot.size + ' 条';
        if (snapshot.empty) {
            container.innerHTML = '<div class="text-center text-gray-400 py-8">暂无留言</div>';
            return;
        }
        container.innerHTML = '';
        snapshot.forEach(doc => {
            const d = doc.data();
            const date = new Date(d.createdAt);
            const timeStr = date.toLocaleString('zh-CN', { hour12: false });
            const row = document.createElement('div');
            row.className = 'card p-3 flex items-start gap-3 text-sm';
            row.innerHTML = `
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="font-medium">${escapeHtml(d.name)}</span>
                        ${d.private ? '<span class="text-[10px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded">仅我可见</span>' : '<span class="text-[10px] bg-green-100 text-green-600 px-1.5 py-0.5 rounded">公开</span>'}
                        <span class="text-[10px] text-gray-400">${timeStr}</span>
                        ${d.city ? `<span class="text-[10px] text-gray-400">· ${d.city}</span>` : ''}
                        ${d.weather ? `<span class="text-[10px]">${d.weather} ${d.temp!=null?d.temp+'°C':''}</span>` : ''}
                    </div>
                    <p class="text-gray-600 text-xs whitespace-pre-wrap">${escapeHtml(d.message)}</p>
                </div>
                <button onclick="deleteMessage('${doc.id}')" class="p-1.5 text-xs text-red-400 hover:text-red-600 hover:bg-red-50 rounded flex-shrink-0" title="删除">
                    <i class="fa-solid fa-trash"></i>
                </button>
            `;
            container.appendChild(row);
        });
    }).catch(err => {
        container.innerHTML = '<div class="text-center text-red-400 py-4">加载失败: ' + err.message + '</div>';
    });
}

function deleteMessage(docId) {
    if (!confirm('删除这条留言？')) return;
    db.collection('guestbook').doc(docId).delete().then(() => {
        showToast('已删除');
        loadMessages();
    }).catch(err => { showToast('删除失败'); });
}

function deleteAllMessages() {
    if (!confirm('确定要清空所有留言吗？此操作不可撤销！')) return;
    const batch = db.batch();
    db.collection('guestbook').get().then(snapshot => {
        if (snapshot.empty) { showToast('没有可删除的留言'); return; }
        snapshot.forEach(doc => batch.delete(doc.ref));
        return batch.commit();
    }).then(() => { showToast('已全部清空'); loadMessages(); })
    .catch(err => { showToast('清空失败'); });
}

// Auto-load messages when switching to messages tab
const origSwitchTab = switchTab;
switchTab = function(name) {
    origSwitchTab(name);
    if (name === 'messages') loadMessages();
};
